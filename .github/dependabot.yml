version: 2
updates:
  # dependências Maven: uma PR semanal com todas as atualizações agrupadas
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      maven-dependencies:
        patterns:
          - "*"
    commit-message:
      prefix: chore
      include: scope

  # actions dos workflows: verificação mensal
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: ci
