spring.application.name=production-review

server.port=8084

spring.profiles.active=${PROFILE:dev}

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

spring.data.redis.host=${REDIS}
spring.data.redis.port=6379
webservices.productionreview.redis.recoverycode.timeout=20

# datas sempre em UTC no banco (a JVM também roda em UTC, ver ProductionReviewApplication)
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jackson.time-zone=UTC

#spring.jpa.properties.hibernate.show_sql=true
#spring.jpa.properties.hibernate.format_sql=true
#spring.flyway.enabled=true


security.token.secret=${SECRET}
security.token.expiration=43200
security.token.expiration.refresh=57600


# Origens aceitas no CORS e nos links enviados por e-mail (separadas por virgula)
app.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8084,https://projetos-web.com}
# URL usada nos links de e-mail quando o Origin da requisicao nao esta na lista acima
app.frontend-url=${FRONTEND_URL:https://projetos-web.com}

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true


file.upload-dir=uploads/
# Increase the size allowed for uploaded files
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB




springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html


# Actuator numa porta só de gerenciamento (8085): o compose não publica essa porta,
# então /actuator/prometheus só é acessível pela rede interna (Prometheus).
management.server.port=${MANAGEMENT_PORT:8085}
management.endpoints.enabled-by-default=false
management.endpoints.web.exposure.include=health,metrics,prometheus
management.endpoint.health.enabled=true
# detalhes (banco, disco, Redis...) só para administradores logados
management.endpoint.health.show-details=when-authorized
management.endpoint.health.roles=ADMIN
management.endpoint.health.probes.enabled=true
management.endpoint.metrics.enabled=true
management.endpoint.prometheus.enabled=true
# todas as métricas com o nome da aplicação (padrão dos dashboards da comunidade)
management.metrics.tags.application=${spring.application.name}
# histograma de latência HTTP: permite p95/p99 no Grafana
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.slo.http.server.requests=100ms,300ms,1s


minio.url=${URL:https://storage.projetos-web.com}
minio.access.name=${ACESS_NAME}
minio.access.secret=${ACESS_SECRET}
minio.bucket.name=${BUCKET_NAME:production-review}


spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP_ID:logs-production-review}


# Importação do Open Food Facts (limite deles: ~10 buscas/minuto)
openfoodfacts.base-url=${OPEN_FOOD_FACTS_URL:https://world.openfoodfacts.org}
openfoodfacts.min-interval-ms=${OPEN_FOOD_FACTS_MIN_INTERVAL_MS:6500}
openfoodfacts.retry-delay-ms=${OPEN_FOOD_FACTS_RETRY_DELAY_MS:15000}

# Serviço de logs/auditoria (production-review-api-logs), acessado só pelo proxy /admin/activity
logs.service.url=${LOGS_SERVICE_URL:http://localhost:8089}
logs.api.token=${LOGS_API_TOKEN:}
