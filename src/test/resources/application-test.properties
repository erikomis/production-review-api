spring.datasource.driver-class-name=org.h2.Driver
# MODE=MySQL aproxima o comportamento do MariaDB; NON_KEYWORDS=USER permite a tabela "user"
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;NON_KEYWORDS=USER;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

spring.flyway.enabled=false

security.token.secret=test-secret
security.token.expiration=900
security.token.expiration.refresh=57600

app.allowed-origins=http://localhost:5173,https://projetos-web.com
app.frontend-url=https://projetos-web.com

# usa o datasource acima também nos testes @DataJpaTest
spring.test.database.replace=none

minio.url=http://localhost:9000
minio.access.name=test
minio.access.secret=test
